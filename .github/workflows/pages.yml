name: Publish versioned game assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['asset_sources/**', 'lpc_entry/**', 'other_assets/**', 'tools/**', 'scripts/**', 'config/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: assets-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install pygame==2.6.1
      - run: python tools/build_character_assets.py
      - run: python tools/build_training_dummy.py
      - run: npm test
      - run: npm run publish:assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static assets
        id: deployment
        uses: actions/deploy-pages@v4
