name: Publish prepared game assets
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: HTTPS URL of game-assets.zip built locally from assets/ (no raw sources)
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: assets-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Download prepared game-ready bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          mkdir -p temp_assets
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 134217728 "$BUNDLE_URL" --output temp_assets/game-assets.zip
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/prepared_bundle.py extract temp_assets/game-assets.zip
      - run: npm test
      - run: npm run publish:assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static assets
        id: deployment
        uses: actions/deploy-pages@v4
