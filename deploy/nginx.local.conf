worker_processes 1;
error_log logs/little-battle-local-error.log notice;
pid logs/little-battle-local.pid;

events {
    worker_connections 256;
}

http {
    include D:/Tool/nginx-1.31.8/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 64k;

    server {
        listen 127.0.0.1:5000;
        server_name localhost;

        location = /assets/manifest.json {
            alias D:/GitHub/little_battle_assets/public/manifest.json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /assets/releases/ {
            alias D:/GitHub/little_battle_assets/public/releases/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8787/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            return 404;
        }
    }
}
